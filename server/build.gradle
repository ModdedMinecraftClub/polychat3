 * For more details on building Java & JVM projects, please refer to https://docs.gradle.org/9.2.1/userguide/building_java_projects.html in the Gradle documentation.
 */

plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'java'
    id 'com.gradleup.shadow' version '9.3.1'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // core's plain jar is disabled; use its shaded jar
    implementation project(path: ':core', configuration: 'shadowRuntimeElements')
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'club.moddedminecraft.polychat3.server.Server'
}

// The release is the single shadow jar, with core inside
tasks.named('jar') {
    enabled = false
}

tasks.named('shadowJar') {
    archiveBaseName = 'polychat3-server'
    archiveClassifier = ''
}

// Only the jar is released, so skip the application plugin's zip and tar bundles
tasks.matching { it.name in ['distZip', 'distTar', 'shadowDistZip', 'shadowDistTar'] }.configureEach {
    enabled = false
}
